<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160" role="img" aria-label="加载中">
  <g fill="#00b5b5" stroke="#00b5b5">
    <!-- 涟漪 1：最大、最先荡开 -->
    <ellipse cx="100" cy="120" rx="4" ry="1.4" stroke-width="1" opacity="0">
      <animate attributeName="rx" values="4;4;92" keyTimes="0;0.2;1" dur="1s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.2 0.6 0.4 1"/>
      <animate attributeName="ry" values="1.4;1.4;33" keyTimes="0;0.2;1" dur="1s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.2 0.6 0.4 1"/>
      <animate attributeName="opacity" values="0;0;0.35;0" keyTimes="0;0.2;0.22;1" dur="1s" repeatCount="indefinite"/>
    </ellipse>

    <!-- 涟漪 2 -->
    <ellipse cx="100" cy="120" rx="4" ry="1.4" stroke-width="1" opacity="0">
      <animate attributeName="rx" values="4;4;74" keyTimes="0;0.28;1" dur="1s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.2 0.6 0.4 1"/>
      <animate attributeName="ry" values="1.4;1.4;27" keyTimes="0;0.28;1" dur="1s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.2 0.6 0.4 1"/>
      <animate attributeName="opacity" values="0;0;0.3;0" keyTimes="0;0.28;0.30;1" dur="1s" repeatCount="indefinite"/>
    </ellipse>

    <!-- 涟漪 3：最小、最晚 -->
    <ellipse cx="100" cy="120" rx="4" ry="1.4" stroke-width="1" opacity="0">
      <animate attributeName="rx" values="4;4;56" keyTimes="0;0.36;1" dur="1s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.2 0.6 0.4 1"/>
      <animate attributeName="ry" values="1.4;1.4;20" keyTimes="0;0.36;1" dur="1s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.2 0.6 0.4 1"/>
      <animate attributeName="opacity" values="0;0;0.28;0" keyTimes="0;0.36;0.38;1" dur="1s" repeatCount="indefinite"/>
    </ellipse>

    <!-- 水滴：0–22% 加速落下，触水压扁后消失 -->
    <ellipse cx="100" cy="-10" rx="5" ry="7" stroke="none" opacity="0">
      <animate attributeName="cy" values="-10;117;120;120" keyTimes="0;0.19;0.22;1" dur="1s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 1 0.8;0 0 1 1;0 0 1 1"/>
      <animate attributeName="rx" values="5;5;9;9" keyTimes="0;0.19;0.22;1" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="7;7;2;2" keyTimes="0;0.18;0.22;1" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.2;0.25;1" dur="1s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>