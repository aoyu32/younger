<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="加载中">
  <!-- 基础 loading：浅色轨道 + 3/4 圆弧旋转，颜色跟随 currentColor -->
  <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <circle cx="12" cy="12" r="8.75" opacity="0.18"/>
    <path d="M12 3.25A8.75 8.75 0 1 1 3.25 12">
      <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.8s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
