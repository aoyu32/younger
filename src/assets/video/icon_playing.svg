<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <style>
    .bar {
      animation: eq 1s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .bar:nth-of-type(2) {
      animation-delay: 0.2s;
    }
    .bar:nth-of-type(3) {
      animation-delay: 0.4s;
    }
    .bar:nth-of-type(4) {
      animation-delay: 0.6s;
    }
    @keyframes eq {
      0%,
      100% {
        transform: scaleY(0.3);
      }
      50% {
        transform: scaleY(1);
      }
    }
  </style>
  <rect class="bar" x="1" y="3" width="3" height="14" rx="1.5" fill="#00b5b5" />
  <rect class="bar" x="6" y="3" width="3" height="14" rx="1.5" fill="#00b5b5" />
  <rect class="bar" x="11" y="3" width="3" height="14" rx="1.5" fill="#00b5b5" />
  <rect class="bar" x="16" y="3" width="3" height="14" rx="1.5" fill="#00b5b5" />
</svg>
