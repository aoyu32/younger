<svg viewBox="0 0 2062 110.197" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2062.000000" height="110.197205" fill="none" customFrame="#000000">
	<defs>
		<linearGradient id="paint_linear_0" x1="2062" x2="0" y1="55.0912247" y2="55.0912247" gradientUnits="userSpaceOnUse">
			<stop stop-color="rgb(178,177,177)" offset="0" stop-opacity="1" />
			<stop stop-color="rgb(0,181,181)" offset="0.5" stop-opacity="0.8" />
			<stop stop-color="rgb(178,177,177)" offset="1" stop-opacity="1" />
		</linearGradient>

		<linearGradient id="pulseGradient" x1="0" x2="1" y1="0" y2="0">
			<stop offset="0" stop-color="white" stop-opacity="0" />
			<stop offset="0.45" stop-color="white" stop-opacity="0.55" />
			<stop offset="1" stop-color="white" stop-opacity="0.85" />
		</linearGradient>

		<mask id="pulseMask" maskUnits="userSpaceOnUse" x="0" y="0" width="2062" height="110.197">
			<rect x="-60" y="0" width="60" height="110.197" fill="url(#pulseGradient)">
				<!-- 移动：总时长8秒，扫描占前65%，先快后慢，起步平缓 -->
				<animate attributeName="x"
					keyTimes="0;0.65;1" values="-60;2062;2062" dur="8s"
					calcMode="spline" keySplines="0.25 0.1 0.25 1;0 0 1 1"
					repeatCount="indefinite" />
				<!-- 透明度：从扫描开始就持续降低，到终点时完全消失 -->
				<animate attributeName="opacity"
					keyTimes="0;0.65;1" values="1;0;0" dur="8s"
					calcMode="spline" keySplines="0.25 0.1 0.25 1;0 0 1 1"
					repeatCount="indefinite" />
			</rect>
		</mask>

		<filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
			<feGaussianBlur stdDeviation="1.8" result="blur1" />
			<feGaussianBlur stdDeviation="0.6" result="blur2" />
			<feMerge>
				<feMergeNode in="blur1" />
				<feMergeNode in="blur2" />
				<feMergeNode in="SourceGraphic" />
			</feMerge>
		</filter>
	</defs>

