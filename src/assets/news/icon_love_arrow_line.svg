<svg viewBox="-10 0 1542.90 70" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="auto" fill="none" customFrame="#000000">
	<defs>
		<!-- 主体渐变色：从箭尾(灰) → 箭头(主色青)，覆盖整个箭形范围 -->
		<linearGradient id="paint_linear_0" x1="17.64" x2="1513.2" y1="35" y2="35" gradientUnits="userSpaceOnUse">
			<stop stop-color="rgb(178,177,177)" offset="0" stop-opacity="1" />
			<stop stop-color="rgb(0,181,181)" offset="1" stop-opacity="1" />
		</linearGradient>

		<!-- 光束彗星渐变：尾部透明，头部（运动方向）明亮 -->
		<linearGradient id="beamGradient" x1="0" x2="1" y1="0" y2="0">
			<stop offset="0" stop-color="white" stop-opacity="0" />
			<stop offset="0.5" stop-color="white" stop-opacity="0.55" />
			<stop offset="1" stop-color="white" stop-opacity="1" />
		</linearGradient>

		<mask id="beamMask" maskUnits="userSpaceOnUse" x="-10" y="0" width="1542.90" height="70">
			<rect x="-70" y="0" width="70" height="70" fill="url(#beamGradient)">
				<animate attributeName="x"
					keyTimes="0;0.6;1" values="-70;1450;1450" dur="5.5s"
					calcMode="spline" keySplines="0.2 0.6 0.3 1;0 0 1 1"
					repeatCount="indefinite" />
				<animate attributeName="opacity"
					keyTimes="0;0.6;1" values="1;0;0" dur="5.5s"
					calcMode="spline" keySplines="0.3 0 0.7 1;0 0 1 1"
					repeatCount="indefinite" />
			</rect>
		</mask>

		<filter id="beamGlow" x="-80%" y="-80%" width="260%" height="260%">
			<feGaussianBlur stdDeviation="1.6" result="blur1" />
			<feGaussianBlur stdDeviation="0.5" result="blur2" />
			<feMerge>
				<feMergeNode in="blur1" />
				<feMergeNode in="blur2" />
				<feMergeNode in="SourceGraphic" />
			</feMerge>
		</filter>
	</defs>

	<!-- 箭尾：鱼尾式，分叉朝左（向后展开） -->
	<path id="箭尾" d="M30.00 35.00L17.64 28.43M30.00 35.00L17.64 41.57" stroke="url(#paint_linear_0)" stroke-width="1.2" stroke-linecap="round" />

	<!-- 箭杆（连接箭尾与箭头） -->
	<path id="箭杆" d="M30.00 35.00L1500.00 35.00" stroke="url(#paint_linear_0)" stroke-width="1.2" stroke-linecap="round" />

	<!-- 箭头：线性心形，心尖朝右，缩放至原来的 0.6 倍并保持心尖位置在 (1500,35)，与箭杆共用同一整体渐变 -->
	<g transform="translate(1500,35) scale(0.6) translate(-2002.37,-35)">
		<path id="心形箭头" d="M2002.37 35.00 2002.15 34.98 2001.51 34.86 2000.54 34.53 1999.35 33.92 1998.11 33.00 1996.97 31.75 1996.08 30.21 1995.55 28.43 1995.47 26.53 1995.87 24.61 1996.73 22.80 1998.00 21.24 1999.59 20.03 2001.42 19.26 2003.37 19.00 2005.37 19.26 2007.35 20.03 2009.27 21.24 2011.11 22.80 2012.87 24.61 2014.56 26.53 2016.19 28.43 2017.75 30.21 2019.24 31.75 2020.63 33.00 2021.87 33.92 2022.91 34.53 2023.70 34.86 2024.20 34.98 2024.37 35.00 2024.20 35.02 2023.70 35.14 2022.91 35.47 2021.87 36.08 2020.63 37.00 2019.24 38.25 2017.75 39.79 2016.19 41.57 2014.56 43.47 2012.87 45.39 2011.11 47.20 2009.27 48.76 2007.35 49.97 2005.37 50.74 2003.37 51.00 2001.42 50.74 1999.59 49.97 1998.00 48.76 1996.73 47.20 1995.87 45.39 1995.47 43.47 1995.55 41.57 1996.08 39.79 1996.97 38.25 1998.11 37.00 1999.35 36.08 2000.54 35.47 2001.51 35.14 2002.15 35.02 2002.37 35.00Z" stroke="url(#paint_linear_0)" stroke-width="1.2" stroke-linejoin="round" />
	</g>

	<!-- 螺旋光束：沿箭身的正弦轨迹，被彗星光带遮罩逐段点亮 -->
	<path id="螺旋光束轨迹" d="M30.00 35.00 38.96 37.29 47.92 39.43 56.88 41.27 65.84 42.71 74.81 43.64 83.77 44.00 92.73 43.77 101.69 42.96 110.65 41.63 119.61 39.87 128.57 37.78 137.53 35.51 146.50 33.21 155.46 31.03 164.42 29.11 173.38 27.57 182.34 26.52 191.30 26.03 200.26 26.13 209.22 26.81 218.19 28.03 227.15 29.71 236.11 31.73 245.07 33.97 254.03 36.28 262.99 38.50 271.95 40.50 280.91 42.13 289.88 43.29 298.84 43.91 307.80 43.94 316.76 43.39 325.72 42.28 334.68 40.70 343.64 38.74 352.60 36.53 361.57 34.23 370.53 31.98 379.49 29.92 388.45 28.20 397.41 26.92 406.37 26.18 415.33 26.01 424.29 26.44 433.26 27.43 442.22 28.91 451.18 30.80 460.14 32.96 469.10 35.26 478.06 37.54 487.02 39.65 495.98 41.45 504.95 42.84 513.91 43.70 522.87 44.00 531.83 43.70 540.79 42.84 549.75 41.45 558.71 39.65 567.67 37.54 576.63 35.26 585.60 32.96 594.56 30.80 603.52 28.91 612.48 27.43 621.44 26.44 630.40 26.01 639.36 26.18 648.32 26.92 657.29 28.20 666.25 29.92 675.21 31.98 684.17 34.23 693.13 36.53 702.09 38.74 711.05 40.70 720.01 42.28 728.98 43.39 737.94 43.94 746.90 43.91 755.86 43.29 764.82 42.13 773.78 40.50 782.74 38.50 791.70 36.28 800.67 33.97 809.63 31.73 818.59 29.71 827.55 28.03 836.51 26.81 845.47 26.13 854.43 26.03 863.39 26.52 872.36 27.57 881.32 29.11 890.28 31.03 899.24 33.21 908.20 35.51 917.16 37.78 926.12 39.87 935.08 41.63 944.05 42.96 953.01 43.77 961.97 44.00 970.93 43.64 979.89 42.71 988.85 41.27 997.81 39.43 1006.77 37.29 1015.74 35.00 1024.70 32.71 1033.66 30.57 1042.62 28.73 1051.58 27.29 1060.54 26.36 1069.50 26.00 1078.46 26.23 1087.42 27.04 1096.39 28.37 1105.35 30.13 1114.31 32.22 1123.27 34.49 1132.23 36.79 1141.19 38.97 1150.15 40.89 1159.11 42.43 1168.08 43.48 1177.04 43.97 1186.00 43.87 1194.96 43.19 1203.92 41.97 1212.88 40.29 1221.84 38.27 1230.80 36.03 1239.77 33.72 1248.73 31.50 1257.69 29.50 1266.65 27.87 1275.61 26.71 1284.57 26.09 1293.53 26.06 1302.49 26.61 1311.46 27.72 1320.42 29.30 1329.38 31.26 1338.34 33.47 1347.30 35.77 1356.26 38.02 1365.22 