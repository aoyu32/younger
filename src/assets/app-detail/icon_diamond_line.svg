<svg viewBox="0 0 1200 70" xmlns="http://www.w3.org/2000/svg" width="100%" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
	<!-- 周期 4s：0~2.4s 线色从两端向中间变为主色 → 2.4s 钻石亮起主色光晕 → 回落为灰色 → 循环 -->
	<defs>
		<!-- 主色扫过的范围：从线的外端(60)逐渐扩展到钻石(588) -->
		<clipPath id="sweep">
			<rect x="0" y="25" width="0" height="20">
				<animate attributeName="width" dur="4s" repeatCount="indefinite"
					calcMode="spline" keyTimes="0;0.58;1" keySplines="0.4 0.1 0.7 0.9;0 0 1 1"
					values="0;588;588" />
			</rect>
		</clipPath>

		<filter id="glowBlur" x="-200%" y="-100%" width="500%" height="300%">
			<feGaussianBlur stdDeviation="4" />
		</filter>

		<radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="currentColor" stop-opacity="0.4" />
			<stop offset="0.5" stop-color="currentColor" stop-opacity="0.12" />
			<stop offset="1" stop-color="currentColor" stop-opacity="0" />
		</radialGradient>

		<!-- 两端渐隐：线条外端从透明过渡到实色 -->
		<linearGradient id="end-fade" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#fff" stop-opacity="0" />
			<stop offset="0.12" stop-color="#fff" stop-opacity="1" />
			<stop offset="0.88" stop-color="#fff" stop-opacity="1" />
			<stop offset="1" stop-color="#fff" stop-opacity="0" />
		</linearGradient>
		<mask id="end-fade-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="70">
			<rect x="0" y="0" width="1200" height="70" fill="url(#end-fade)" />
		</mask>
	</defs>

	<!-- 线条组：底线 + 两侧扫线，两端渐隐 -->
	<g mask="url(#end-fade-mask)">
	<!-- 灰色底线 -->
	<path d="M0 35 H588" stroke="#c8c8c8" stroke-width="0.6" stroke-linecap="round" />
	<path d="M1200 35 H612" stroke="#c8c8c8" stroke-width="0.6" stroke-linecap="round" />

	<!-- 左侧：主色从外端向中间蔓延 -->
	<path d="M0 35 H588" stroke="currentColor" stroke-width="0.6" stroke-linecap="round"
		clip-path="url(#sweep)" opacity="1">
		<animate attributeName="opacity" dur="4s" repeatCount="indefinite"
			keyTimes="0;0.66;0.9;1" values="1;1;0;0" />
	</path>

	<!-- 右侧：镜像 -->
	<g transform="translate(1200 0) scale(-1 1)">
		<path d="M0 35 H588" stroke="currentColor" stroke-width="0.6" stroke-linecap="round"
			clip-path="url(#sweep)" opacity="1">
			<animate attributeName="opacity" dur="4s" repeatCount="indefinite"
				keyTimes="0;0.66;0.9;1" values="1;1;0;0" />
		</path>
	</g>
	</g>

	<!-- 主色光晕（平时不可见，线色汇聚到达时亮起） -->
	<circle cx="600" cy="35" r="16" fill="url(#halo)" opacity="0">
		<animate attributeName="opacity" dur="4s" repeatCount="indefinite"
			keyTimes="0;0.6;0.66;0.9;1" values="0;0;0.5;0;0" />
	</circle>

	<!-- 钻石轮廓发光 -->
	<path d="M600 22 L605 35 L600 48 L595 35 Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"
		filter="url(#glowBlur)" opacity="0">
		<animate attributeName="opacity" dur="4s" repeatCount="indefinite"
			keyTimes="0;0.6;0.66;0.9;1" values="0;0;0.45;0;0" />
	</path>

	<!-- 透明钻石：浅灰细线轮廓 + 中心点 -->
	<path d="M600 22 L605 35 L600 48 L595 35 Z" stroke="#c4c4c4" stroke-width="0.8" stroke-linejoin="round" />
	<circle cx="600" cy="35" r="1.2" fill="#c4c4c4" />

	<!-- 亮起时钻石与中心点变为主色 -->
	<g opacity="0">
		<animate attributeName="opacity" dur="4s" repeatCount="indefinite"
			keyTimes="0;0.6;0.66;0.9;1" values="0;0;1;0;0" />
		<path d="M600 22 L605 35 L600 48 L595 35 Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round" />
		<circle cx="600" cy="35" r="1.2" fill="currentColor" />
	</g>
</svg>
